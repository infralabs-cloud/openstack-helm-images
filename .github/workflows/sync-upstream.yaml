# Merge upstream openstack-helm-images master into this repository.
#
# Upstream has no release branches or tags: every release is built from
# master. Both master and 2026.1 therefore follow upstream master, while
# keeping the commits that only exist here (these workflows, arm64 fixes).
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the image
# build is dispatched explicitly when 2026.1 changes.
name: sync-upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream

env:
  UPSTREAM: https://opendev.org/openstack/openstack-helm-images

jobs:
  sync:
    name: sync (${{ matrix.branch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch:
          - master
          - "2026.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      # A conflict fails this step and leaves the branch untouched; resolve
      # it by hand by merging upstream master locally.
      - name: Merge upstream master
        id: merge
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "${UPSTREAM}" master
          before=$(git rev-parse HEAD)
          git merge --no-edit -m "Merge upstream master into ${BRANCH}" FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "${before}" ]; then
            git push origin HEAD:"${BRANCH}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build 2026.1 images
        if: matrix.branch == '2026.1' && steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run images-2026.1-ubuntu_noble.yaml --repo "${GITHUB_REPOSITORY}" --ref 2026.1
