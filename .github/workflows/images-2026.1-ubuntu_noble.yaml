# Build the 2026.1 Ubuntu Noble images for linux/amd64 and linux/arm64 and
# publish them as ghcr.io/infralabs-cloud/<image>:2026.1-ubuntu_noble.
#
# Build arguments mirror the Zuul jobs in zuul.d/, except that Ceph comes from
# download.ceph.com: the Mirantis mirror used there only carries amd64.
#
# Runs from the 2026.1 branch, on push and when sync-upstream merges new
# upstream commits into it. A push only builds the images its changes affect;
# a manual run builds the images given in its "images" input.
name: images-2026.1-ubuntu_noble

on:
  push:
    branches:
      - "2026.1"
    paths-ignore:
      - "doc/**"
      - "releasenotes/**"
      - "**.md"
      - "**.rst"
      - "zuul.d/**"
  workflow_dispatch:
    inputs:
      images:
        description: >-
          Images to build, separated by spaces or commas, or "all". Service
          images are built on the published base and venv_builder unless those
          are listed too.
        type: string
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Decide which images to build. The result is a space padded list of image
  # names, plus "services" for every service image, or "all".
  plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Select images
        id: plan
        env:
          REQUESTED: ${{ inputs.images }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != push ]; then
            images=$(echo "${REQUESTED:-all}" | tr ',' ' ')
          elif ! changed=$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" 2>/dev/null); then
            # New branch or force push: nothing to compare against.
            images=all
          else
            images=$(echo "${changed}" | while read -r file; do
              case "${file}" in
                (base/*) echo base services ;;
                (venv_builder/*) echo venv_builder services ;;
                (bindep.txt|pydep.txt) echo services ;;
                (*/*) echo "${file%%/*}" ;;
              esac
            done | sort -u | tr '\n' ' ')
          fi
          images=" $(echo ${images}) "
          case "${images}" in *" all "*) images=all ;; esac
          echo "Building: ${images}"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  base:
    needs: plan
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      skip: ${{ needs.plan.outputs.images != 'all' && !contains(needs.plan.outputs.images, ' base ') }}
      image: base
      tag: 2026.1-ubuntu_noble
      dockerfile: base/Dockerfile
      build-args: |
        FROM=public.ecr.aws/ubuntu/ubuntu:noble
        CEPH_REPO=https://download.ceph.com/debian-tentacle
        CEPH_KEY=https://download.ceph.com/keys/release.asc

  venv_builder:
    needs: plan
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      skip: ${{ needs.plan.outputs.images != 'all' && !contains(needs.plan.outputs.images, ' venv_builder ') }}
      image: venv_builder
      tag: 2026.1-ubuntu_noble
      dockerfile: venv_builder/Dockerfile
      build-args: |
        FROM=public.ecr.aws/ubuntu/ubuntu:noble
        REQUIREMENTS_REF=stable/2026.1
        SETUPTOOLS_CONSTRAINT=

  libvirt:
    needs: plan
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      skip: ${{ needs.plan.outputs.images != 'all' && !contains(needs.plan.outputs.images, ' libvirt ') }}
      image: libvirt
      tag: 2026.1-ubuntu_noble
      context: libvirt
      dockerfile: libvirt/Dockerfile
      build-args: |
        FROM=quay.io/airshipit/ubuntu:noble
        RELEASE=gazpacho
        CEPH_REPO=https://download.ceph.com/debian-tentacle
        CEPH_KEY=https://download.ceph.com/keys/release.asc

  # Infrastructure images that do not depend on base or venv_builder. Upstream
  # tags these latest-ubuntu_noble and the like; here they share the 2026.1 tag.
  infra:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ceph-config-helper
            context: ceph-config-helper
            dockerfile: ceph-config-helper/Dockerfile.ubuntu
            args: |
              FROM=quay.io/airshipit/ubuntu:noble
              CEPH_RELEASE=tentacle
              CEPH_RELEASE_TAG=20.2.4-1noble
              CEPH_REPO=https://download.ceph.com/debian-tentacle
              CEPH_KEY=https://download.ceph.com/keys/release.asc
          - image: ceph-daemon
            context: ceph-daemon
            dockerfile: ceph-daemon/Dockerfile.ubuntu
            args: |
              FROM=quay.io/airshipit/ubuntu:noble
              CEPH_RELEASE=tentacle
              CEPH_RELEASE_TAG=20.2.4-1noble
              CEPH_REPO=https://download.ceph.com/debian-tentacle
              CEPH_KEY=https://download.ceph.com/keys/release.asc
          - image: ceph-utility
            context: ceph-utility
            dockerfile: ceph-utility/Dockerfile.ubuntu
            args: |
              FROM=quay.io/airshipit/ubuntu:noble
              CEPH_RELEASE=tentacle
              CEPH_RELEASE_TAG=20.2.4-1noble
              CEPH_REPO=https://download.ceph.com/debian-tentacle
              CEPH_KEY=https://download.ceph.com/keys/release.asc
          - image: fluentd
            context: fluentd
            dockerfile: fluentd/Dockerfile.debian
            args: ""
          # Used by every openstack-helm chart for dependency checks. It lives
          # in airship/kubernetes-entrypoint and upstream only publishes amd64.
          # Its default Go builder image is amd64 only, so use a multiarch one.
          - image: kubernetes-entrypoint
            context: https://opendev.org/airship/kubernetes-entrypoint.git#521a5c8aa64253453a4cc5c5af1926c0a93fba67
            dockerfile: images/Dockerfile.ubuntu_noble
            args: |
              FROM=quay.io/airshipit/ubuntu:noble
              GOLANG_IMAGE=public.ecr.aws/docker/library/golang:1.26.5-trixie
          - image: mariadb
            context: mariadb
            dockerfile: mariadb/Dockerfile.ubuntu
            args: FROM=public.ecr.aws/docker/library/mariadb:11.4.8-noble
          - image: nagios
            context: nagios
            dockerfile: nagios/Dockerfile
            args: FROM=quay.io/airshipit/ubuntu:noble
          - image: node-problem-detector
            context: node-problem-detector
            dockerfile: node-problem-detector/Dockerfile
            args: FROM=quay.io/airshipit/ubuntu:noble
          - image: openvswitch
            context: openvswitch
            dockerfile: openvswitch/Dockerfile.ubuntu
            args: FROM=quay.io/airshipit/ubuntu:noble
          - image: openvswitch
            tag: 2026.1-ubuntu_noble-dpdk
            context: openvswitch
            dockerfile: openvswitch/Dockerfile.ubuntu-dpdk
            args: FROM=quay.io/airshipit/ubuntu:noble
          - image: osh-selenium
            context: osh-selenium
            dockerfile: osh-selenium/Dockerfile.ubuntu
            args: FROM=quay.io/airshipit/ubuntu:noble
          - image: ovn
            context: ovn
            dockerfile: ovn/Dockerfile.ubuntu
            args: FROM=quay.io/airshipit/ubuntu:noble
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      skip: ${{ needs.plan.outputs.images != 'all' && !contains(needs.plan.outputs.images, format(' {0} ', matrix.image)) }}
      image: ${{ matrix.image }}
      tag: ${{ matrix.tag || '2026.1-ubuntu_noble' }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      build-args: ${{ matrix.args }}

  # Service images are built on top of the base and venv_builder images from
  # this run, pinned by digest, or on the published ones when those were not
  # rebuilt.
  services:
    needs: [plan, base, venv_builder]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: barbican
            args: BARBICAN_REF=stable/2026.1
          - image: blazar
            args: BLAZAR_REF=stable/2026.1
          - image: ceilometer
            args: CEILOMETER_REF=stable/2026.1
          - image: cinder
            args: CINDER_REF=stable/2026.1
          - image: cloudkitty
            args: CLOUDKITTY_REF=stable/2026.1
          - image: cyborg
            args: CYBORG_REF=stable/2026.1
          - image: designate
            args: DESIGNATE_REF=stable/2026.1
          - image: freezer
            args: FREEZER_REF=stable/2026.1
          - image: freezer-api
            args: FREEZER_API_REF=stable/2026.1
          - image: glance
            args: GLANCE_REF=stable/2026.1
          - image: heat
            args: HEAT_REF=stable/2026.1
          - image: horizon
            args: HORIZON_REF=stable/2026.1
          - image: ironic
            args: IRONIC_REF=stable/2026.1
          - image: keystone
            args: KEYSTONE_REF=stable/2026.1
          - image: magnum
            args: MAGNUM_REF=stable/2026.1
          - image: manila
            args: MANILA_REF=stable/2026.1
          - image: masakari
            args: MASAKARI_REF=stable/2026.1
          - image: masakari-monitors
            args: MASAKARI_MONITORS_REF=stable/2026.1
          - image: mistral
            args: MISTRAL_REF=stable/2026.1
          - image: neutron
            args: NEUTRON_REF=stable/2026.1
          - image: nova
            args: NOVA_REF=stable/2026.1
          - image: octavia
            args: OCTAVIA_REF=stable/2026.1
          - image: openstack-client
            args: OPENSTACKCLIENT_REF=stable/2026.1
          # openstack-client plus the remaining 2026.1 clients and Ceph tools
          - image: openstack-tools
            args: OPENSTACKCLIENT_REF=stable/2026.1
          - image: ovn-bgp-agent
            args: OVN_BGP_AGENT_REF=stable/2026.1
          - image: placement
            args: PLACEMENT_REF=stable/2026.1
          - image: skyline
            args: |
              SKYLINE_APISERVER_REF=stable/2026.1
              SKYLINE_CONSOLE_REF=stable/2026.1
          - image: swift
            args: SWIFT_REF=stable/2026.1
          - image: tacker
            args: TACKER_REF=stable/2026.1
          # Tempest is branchless upstream, so it is built from master.
          - image: tempest
            args: TEMPEST_REF=master
          - image: trove
            args: TROVE_REF=stable/2026.1
          - image: watcher
            args: WATCHER_REF=stable/2026.1
          - image: zaqar
            args: ZAQAR_REF=stable/2026.1
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      skip: >-
        ${{ needs.plan.outputs.images != 'all'
            && !contains(needs.plan.outputs.images, ' services ')
            && !contains(needs.plan.outputs.images, format(' {0} ', matrix.image)) }}
      image: ${{ matrix.image }}
      tag: 2026.1-ubuntu_noble
      dockerfile: ${{ matrix.image }}/Dockerfile
      build-args: |
        BASE_VENV_BUILDER=${{ needs.venv_builder.outputs.ref || 'ghcr.io/infralabs-cloud/venv_builder:2026.1-ubuntu_noble' }}
        BASE_RUNTIME=${{ needs.base.outputs.ref || 'ghcr.io/infralabs-cloud/base:2026.1-ubuntu_noble' }}
        ${{ matrix.args }}
