# Reusable workflow: build one image natively on amd64 and arm64 runners,
# push each platform by digest, then join them into a single multiarch tag.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under the registry prefix, e.g. nova.
        required: true
        type: string
      tag:
        description: Tag to publish, e.g. 2026.1-ubuntu_noble. A dated tag is pushed too.
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        required: true
        type: string
      context:
        description: Build context, relative to the repository root.
        type: string
        default: .
      build-args:
        description: Newline separated KEY=VALUE build arguments.
        type: string
        default: ""
      registry:
        description: Registry and namespace the image is pushed to.
        type: string
        default: ghcr.io/infralabs-cloud
    outputs:
      ref:
        description: The published multiarch image, pinned by digest.
        value: ${{ jobs.merge.outputs.ref }}

env:
  IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
  TAG: ${{ inputs.tag }}

jobs:
  build:
    name: ${{ inputs.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache on purpose: the Dockerfiles clone stable branches by
      # name, so a cached layer would never pick up new upstream commits.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ inputs.image }} (manifest)
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.inspect.outputs.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multiarch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:${TAG}-$(date -u +%Y%m%d)" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        id: inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "ref=${IMAGE}:${TAG}@${digest}" >> "${GITHUB_OUTPUT}"
